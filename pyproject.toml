[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "usb-cctv-recorder"
version = "0.1.0"
description = "Local USB CCTV recorder for Ubuntu/KDE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "USB CCTV Recorder contributors" }]
dependencies = [
    "PySide6==6.8.2.1",
]

[project.scripts]
usb-cctv-recorder = "usb_cctv_recorder.__main__:main"

[dependency-groups]
dev = [
    "coverage==7.6.12",
    "mypy==1.15.0",
    "pip-audit==2.8.0",
    "pyinstaller==6.21.0",
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "pytest-qt==4.4.0",
    "pyinstaller==6.21.0",
    "ruff==0.9.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usb_cctv_recorder"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=usb_cctv_recorder --cov-report=term-missing"
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["usb_cctv_recorder"]

[tool.coverage.report]
fail_under = 90
show_missing = true
